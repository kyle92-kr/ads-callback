<h1>위캐리 틱톡 연결</h1>
<p id="msg">틱톡 연결 정보를 위캐리 앱으로 넘기지 못했습니다. 위캐리 앱 화면으로 돌아가 안내에 따라 주세요.</p>
<p>이 창은 닫아도 됩니다.</p>
</main>
<script>
// WECARRY_TIKTOK_RELAY_BEGIN
// Static relay: forwards TikTok's redirect query to the marketer's local app on 127.0.0.1 only.
// No network calls, no storage, no secrets. The visible default text is the failure message;
// the page leaves only after every check passes.
(function (root) {
  'use strict';
  var STATE_RE = /^([1-9][0-9]{3,4})\.([A-Za-z0-9_-]{43})$/;
  var CODE_RE = /^[A-Za-z0-9._~-]{8,1024}$/;
  function only(params, name) {
    var all = params.getAll(name);
    if (all.length === 0) return null;
    if (all.length !== 1) return undefined;
    return all[0];
  }
  function planTikTokRelay(href) {
    var url;
    try { url = new URL(String(href)); } catch (e) { return { ok: false, reason: 'URL_INVALID' }; }
    var params = url.searchParams;
    var state = only(params, 'state');
    if (typeof state !== 'string') return { ok: false, reason: 'STATE_INVALID' };
    var m = STATE_RE.exec(state);
    if (!m) return { ok: false, reason: 'STATE_INVALID' };
    var port = Number(m[1]);
    if (!Number.isInteger(port) || port < 1024 || port > 65535) return { ok: false, reason: 'PORT_INVALID' };
    var authCode = only(params, 'auth_code');
    var code = only(params, 'code');
    if (authCode === undefined || code === undefined) return { ok: false, reason: 'CODE_INVALID' };
    if (authCode !== null && !CODE_RE.test(authCode)) return { ok: false, reason: 'CODE_INVALID' };
    if (code !== null && !CODE_RE.test(code)) return { ok: false, reason: 'CODE_INVALID' };
    var target = new URL('http://127.0.0.1/tiktok/callback');
    target.port = String(port);
    if (authCode !== null) target.searchParams.set('auth_code', authCode);
    if (code !== null) target.searchParams.set('code', code);
    target.searchParams.set('state', state);
    if (target.protocol !== 'http:' || target.hostname !== '127.0.0.1' || target.port !== String(port) ||
        target.pathname !== '/tiktok/callback' || target.username || target.password || target.hash) {
      return { ok: false, reason: 'TARGET_INVALID' };
    }
    return { ok: true, target: target.href };
  }
  function run(loc, hist) {
    var plan = planTikTokRelay(loc.href);
    try { hist.replaceState(null, '', loc.pathname); } catch (e) { /* keep the failure text */ }
    if (plan.ok) loc.replace(plan.target);
    return plan.ok;
  }
  root.WeCarryTikTokRelay = { planTikTokRelay: planTikTokRelay, run: run };
  if (root.location && root.history && root.document) run(root.location, root.history);
})(this);
// WECARRY_TIKTOK_RELAY_END
</script>
